<title>Tiger Cam thumbnail</title>
<!-- Rendered to public/thumbnail.jpg at 1920 x 1080: the Showcase card, the film's poster and the link preview. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@600;700&display=block" rel="stylesheet">
<style>
:root { --navy: #142149; --yellow: #ffb81c; --dim: #aab4d0; --mono: "IBM Plex Mono", monospace; --sans: "IBM Plex Sans", sans-serif; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); }
body { position: relative; font-family: var(--sans); color: #fff; }

/* The live camera: the tiger at the bars, as the page shows it by day. */
.cam { position: absolute; left: -160px; top: 0; width: 1440px; height: 1080px; overflow: hidden; background: #000; }
.cam img { width: 100%; height: 100%; object-fit: cover; display: block; filter: contrast(1.06) saturate(0.9); }
.cam::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 45% 45%, transparent 55%, rgba(0,0,0,0.35) 100%); }
.chip { position: absolute; z-index: 2; left: 56px; top: 56px; background: #fff; color: #000; font: 600 30px/1 var(--mono); letter-spacing: 0.04em; padding: 14px 18px; }
.chip i { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: #e0261b; margin-right: 14px; vertical-align: 1px; }
.clock { position: absolute; z-index: 2; left: 56px; bottom: 52px; font: 500 30px/1 var(--mono); letter-spacing: 0.04em; color: #fff; text-shadow: 0 2px 0 #000, 0 0 8px rgba(0,0,0,0.7); }

/* The answer, beside it. */
.panel { position: absolute; z-index: 3; left: 1130px; top: 0; width: 790px; height: 1080px; background: var(--navy); padding: 96px 60px 76px 76px; display: flex; flex-direction: column; }
h1 { font: 700 92px/1.0 var(--sans); letter-spacing: -0.025em; }
.count { margin-top: auto; }
.tries { font: 700 72px/1 var(--sans); letter-spacing: -0.02em; }
.escapes { font: 700 124px/0.95 var(--sans); letter-spacing: -0.035em; color: var(--yellow); margin-top: 10px; }
.note { margin-top: 22px; font: 500 26px/1.35 var(--mono); color: var(--dim); }
.vultr { margin-top: 64px; display: flex; align-items: center; gap: 22px; font: 500 26px/1 var(--mono); color: var(--dim); }
.vultr svg { height: 44px; width: auto; display: block; }
</style>
</head>
